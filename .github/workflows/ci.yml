name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (Debug)
        run: swift build --configuration debug

      - name: Test
        run: swift test --configuration debug

      - name: Verify public-only consumers and optional link boundaries
        run: python3 scripts/verify-consumers.py --cache-from .build --output /tmp/consumer-proof.json

      - name: Verify documentation and public component coverage
        run: |
          python3 scripts/verify-doc-examples.py
          python3 scripts/verify-component-matrix.py

      - uses: actions/upload-artifact@v4
        with:
          name: consumer-proof
          path: /tmp/consumer-proof.json

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.59.1
        run: |
          brew tap swiftlint/packages
          brew install swiftlint/packages/swiftlint@${SWIFTLINT_VERSION}
          echo "$(brew --prefix swiftlint@${SWIFTLINT_VERSION})/bin" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet

  ios-build:
    name: iOS Simulator Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS Example host without signing
        run: |
          xcodebuild -project ExampleApp/ExampleApp.xcodeproj -scheme ExampleApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath /tmp/cy-example-derived CODE_SIGNING_ALLOWED=NO build

      - name: Run iOS regression and UI tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcodebuild -project ExampleApp/ExampleApp.xcodeproj -scheme ExampleApp \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath /tmp/cy-example-derived -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test

      - name: Build and run external consumer UI tests
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for a in d["devices"].values() for v in a if v["name"].startswith("iPhone")))')
          xcodebuild -project ConsumerFixtures/Host/Consumers.xcodeproj -scheme Consumers \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath /tmp/cy-consumer-derived -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (Debug)
        run: swift build --configuration debug

      - name: Test
        run: swift test --configuration debug

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.59.1
        run: |
          brew tap swiftlint/packages
          brew install swiftlint/packages/swiftlint@${SWIFTLINT_VERSION}
          echo "$(brew --prefix swiftlint@${SWIFTLINT_VERSION})/bin" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet

  ios-build:
    name: iOS Simulator Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # 仓库为纯 SwiftPM 包（无 .xcodeproj），xcodebuild -scheme 不可用。
      # 改用 swift build 交叉编译验证 iOS Simulator 目标（全部 Library + ExampleApp）。
      - name: Cross-compile package and ExampleApp for iOS Simulator
        run: |
          SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift build \
            --sdk "$SDK" \
            --triple arm64-apple-ios18.0-simulator \
            -Xlinker -syslibroot -Xlinker "$SDK"

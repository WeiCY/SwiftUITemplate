name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build (Debug)
        run: swift build --configuration debug

      - name: Test
        run: swift test --configuration debug

  lint:
    name: SwiftLint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        env:
          SWIFTLINT_VERSION: 0.59.1
        run: |
          brew tap swiftlint/packages
          brew install swiftlint/packages/swiftlint@${SWIFTLINT_VERSION}
          echo "$(brew --prefix swiftlint@${SWIFTLINT_VERSION})/bin" >> "$GITHUB_PATH"

      - name: Run SwiftLint
        run: swiftlint lint --strict --quiet

  ios-build:
    name: iOS Simulator Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build package and ExampleApp for iOS Simulator
        run: xcodebuild build -scheme ExampleApp -destination 'platform=iOS Simulator,name=iPhone 16 Pro' CODE_SIGNING_ALLOWED=NO

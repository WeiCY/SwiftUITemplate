disabled_rules:
  - trailing_whitespace
  - multiple_closures_with_trailing_closure
  - identifier_name

opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - first_where
  - sorted_first_last
  - trailing_comma
  - vertical_parameter_alignment_on_call

line_length:
  warning: 180
  error: 250

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 800
  error: 1200

function_body_length:
  warning: 80
  error: 120

cyclomatic_complexity:
  warning: 15
  error: 20

nesting:
  type_level:
    warning: 3
    error: 5

included:
  - Sources
  - ExampleApp

excluded:
  - .build
  - .swiftpm
